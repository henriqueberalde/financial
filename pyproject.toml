[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "financial"
version = "1.0.0"
description = "An application to organize my financial life."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas==3.0.6",
    "sqlalchemy==2.1.3",
    "pymysql==1.2.3",
    "cryptography==50.0.2",
    "click==8.5.0",
    "click-repl==0.4.1",
    "alembic==1.20.0",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pycodestyle==2.15.0",
    "notebook==7.6.3",
    "ipykernel==7.4.0",
    "nbformat==5.11.1",
    "nbstripout==0.9.1",
    "plotly==7.1.0",
]

[tool.setuptools.packages.find]
include = ["financial*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["financial"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_also = ["if __name__ == .__main__.:"]
